        :root {

        .next-quiz-btn:hover { background: #357abd; transform: translateY(-2px); }

    </style>
</head>
<body>
<div class="stars-overlay" id="starsOverlay">🌟🎉🌟</div>
<div class="unit-content">
    <div class="sticky-audio-bar">
        <button class="btn-audio-control audio-play" id="l2Play" onclick="L2App.playAll()">قراءة آلية ▶️</button>
        <button class="btn-audio-control audio-pause" id="l2Pause" onclick="L2App.togglePause()">مؤقت ⏸️</button>
        <button class="btn-audio-control audio-stop" id="l2Stop" onclick="L2App.stop()">إيقاف ⏹️</button>
    </div>
    <div class="settings-bar">
        <div><label>🐢 السرعة 🐇</label> <input type="range" id="l2Rate" min="0.3" max="1" step="0.1" value="0.7"></div>
        <div><label>🌍 اللكنة</label> <select id="l2Voice" class="voice-select"></select></div>
    </div>
    <div class="main-container">
        <div class="section-nav" id="l2Nav">
            <button class="sec-btn active" onclick="L2App.switchSec('vocab')">🔤 الكلمات</button>
            <button class="sec-btn" onclick="L2App.switchSec('story')">📖 المحادثة</button>
            <button class="sec-btn" onclick="L2App.switchSec('quiz')">✍️ اختبار</button>
        </div>
        <h2 style="text-align:center; color:var(--secondary); margin-bottom: 20px;">Lesson 2: Phonics (M m & G g)</h2>
        <div id="l2Content"></div>
    </div>
</div>
<script>
const L2App = (function() {
    const synth = window.speechSynthesis;
    const lessonData = {
        vocab: [
            {en: "Monkey", ar: "قرد", emoji: "🐒"}, {en: "Milk", ar: "لبن", emoji: "🥛"},
            {en: "Mango", ar: "مانجو", emoji: "🥭"}, {en: "Moon", ar: "قمر", emoji: "🌙"},
            {en: "Mouse", ar: "فأر", emoji: "🐭"}, {en: "Guitar", ar: "جيتار", emoji: "🎸"},
            {en: "Goat", ar: "معزة", emoji: "🐐"}, {en: "Girl", ar: "بنت", emoji: "👧"},
            {en: "Grapes", ar: "عنب", emoji: "🍇"}, {en: "Gloves", ar: "قفازات", emoji: "🧤"}
        ],
        story: [
            {en: "The monkey likes bananas.", ar: "القرد يحب الموز."},
            {en: "I drink milk every day.", ar: "أشرب اللبن كل يوم."},
            {en: "The mango is sweet.", ar: "المانجو حلو."},
            {en: "I see the moon at night.", ar: "أرى القمر في الليل."},
            {en: "I play the guitar.", ar: "أعزف على الجيتار."},
            {en: "The goat eats grass.", ar: "العنزة تأكل العشب."},
            {en: "The girl has grapes.", ar: "البنت لديها عنب."},
            {en: "I wear gloves in winter.", ar: "أرتدي قفازات في الشتاء."}
        ]
    };
    let currentSec = 'vocab', isPlaying = false, isPaused = false;
    function el(id) { return document.getElementById('l2' + id); }
    function loadVoices() {
        let voices = synth.getVoices();
        const norm = l => (l || '').toLowerCase().replace('_', '-');
        let enV = voices.filter(v => norm(v.lang).startsWith('en'));
        const sel = el('Voice');
        if (!sel || !enV.length) return;
        sel.innerHTML = '';
        enV.forEach(v => {
            const o = document.createElement('option');
            o.value = v.name;
            o.textContent = (norm(v.lang).startsWith('en-gb') ? '🇬🇧 ' : '🇺🇸 ') + v.name;
            sel.appendChild(o);
        });
    }
    function init() {
        if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
        loadVoices();
        render();
    }
    function switchSec(sec) {
        currentSec = sec;
        const map = {vocab: 'الكلمات', story: 'المحادثة', quiz: 'اختبار'};
        el('Nav').querySelectorAll('.sec-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(map[sec])));
        render();
    }
    function render() {
        stop();
        const area = el('Content');
        area.innerHTML = '';
        if (currentSec === 'vocab') {
            const g = document.createElement('div'); g.className = 'vocab-grid';
            lessonData.vocab.forEach(v => {
                const d = document.createElement('div'); d.className = 'vocab-item';
                d.innerHTML = `<span style="font-size:36px;display:block;margin-bottom:5px;">${v.emoji}</span><b style="color:var(--primary);font-size:17px;">${v.en}</b><br><small style="font-weight:bold;color:#666;">${v.ar}</small>`;
                d.onclick = () => speak(v.en, d);
                g.appendChild(d);
            });
            area.appendChild(g);
        } else if (currentSec === 'story') {
            lessonData.story.forEach(s => {
                const b = document.createElement('div'); b.className = 'sentence-box';
                b.innerHTML = `<span class="s-en">${s.en}</span><span class="s-ar">${s.ar}</span>`;
                b.onclick = () => speak(s.en, b);
                area.appendChild(b);
            });
        } else { renderQuiz(); }
    }
    function speak(text, element, callback) {
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const sel = el('Voice');
        const chosen = synth.getVoices().find(v => v.name === sel.value);
        if (chosen) u.voice = chosen;
        u.rate = parseFloat(el('Rate').value);
        u.onstart = () => element?.classList.add('active-reading');
        u.onend = () => { element?.classList.remove('active-reading'); if (callback) callback(); };
        u.onerror = () => { element?.classList.remove('active-reading'); if (callback) callback(); };
        synth.speak(u);
    }
    async function playAll() {
        if (isPlaying) return;
        isPlaying = true; isPaused = false;
        el('Play').style.display = 'none'; el('Stop').style.display = 'inline-flex'; el('Pause').style.display = 'inline-flex';
        const items = el('Content').querySelectorAll(currentSec === 'vocab' ? '.vocab-item' : '.sentence-box');
        const d = currentSec === 'vocab' ? lessonData.vocab : lessonData.story;
        for (let i = 0; i < items.length; i++) {
            if (!isPlaying) break;
            while (isPaused && isPlaying) await new Promise(r => setTimeout(r, 100));
            if (!isPlaying) break;
            items[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
            await new Promise(res => speak(d[i].en, items[i], res));
            await new Promise(r => setTimeout(r, 500));
        }
        stop();
    }
    function togglePause() {
        if (!isPlaying) return;
        isPaused = !isPaused;
        el('Pause').textContent = isPaused ? 'استئناف ▶️' : 'مؤقت ⏸️';
        isPaused ? synth.pause() : synth.resume();
    }
    function stop() {
        isPlaying = false; isPaused = false; synth.cancel();
        el('Play').style.display = 'inline-flex'; el('Stop').style.display = 'none'; el('Pause').style.display = 'none';
        document.querySelectorAll('.active-reading').forEach(e => e.classList.remove('active-reading'));
    }
    function renderQuiz() {
        const area = el('Content'), correct = lessonData.vocab[Math.floor(Math.random() * lessonData.vocab.length)];
        let opts = [correct.ar];
        while (opts.length < 3) {
            let r = lessonData.vocab[Math.floor(Math.random() * lessonData.vocab.length)].ar;
            if (!opts.includes(r)) opts.push(r);
        }
        opts.sort(() => Math.random() - 0.5);
        area.innerHTML = `<div class="quiz-card"><h3>ما معنى كلمة: <span style="color:var(--primary);font-size:28px;">${correct.en}</span>؟</h3><div id="quizOptions">${opts.map(o => `<button class="opt-btn" onclick="L2App.checkAns(this, '${o}', '${correct.ar}')">${o}</button>`).join('')}</div><div id="quizFeedback"></div></div>`;
    }
    function checkAns(btn, selected, correct) {
        const buttons = document.querySelectorAll('#quizOptions .opt-btn');
        buttons.forEach(b => b.disabled = true);
        if (selected === correct) {
            btn.classList.add('correct');
            document.getElementById('starsOverlay').classList.add('show');
            setTimeout(() => document.getElementById('starsOverlay').classList.remove('show'), 1000);
            speak("Great job!", null, () => { document.getElementById('quizFeedback').innerHTML = `<button class="next-quiz-btn" onclick="L2App.renderQuiz()">السؤال التالي ➡️</button>`; });
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => { if (b.innerText === correct) b.classList.add('correct'); });
            speak("Try again", null, () => { document.getElementById('quizFeedback').innerHTML = `<button class="next-quiz-btn" onclick="L2App.renderQuiz()">حاول مجددًا 🔄</button>`; });
        }
    }
    return { init, switchSec, playAll, togglePause, stop, renderQuiz, checkAns };
})();
window.onload = L2App.init;
</script>
</body>
