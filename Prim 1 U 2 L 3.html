      💬 تواصل عبر الواتس
    </a>

</div><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 3: Shapes and Colors</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e84855; --secondary: #3185fc; --bg: #FFF8F0; --success: #00b894; --danger: #ff7675; --highlight: #fff9c4; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #2d3436; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: var(--secondary); margin-bottom: 15px; font-size: 22px; }
        .controls { display: flex; gap: 10px; justify-content: center; background: #f8f9fa; padding: 10px; border-radius: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn { border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; color: white; font-family: 'Cairo'; transition: 0.2s; }
        .btn-play { background: var(--primary); } .btn-pause { background: #f1c40f; color: #333; display: none; } .btn-stop { background: var(--danger); display: none; }
        .nav-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { border: none; background: #eee; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; }
        .tab-btn.active { background: var(--secondary); color: white; }
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .vocab-card { border: 2px solid #eee; border-radius: 14px; padding: 10px; text-align: center; cursor: pointer; background: #fff; transition: 0.2s; }
        .vocab-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .vocab-card.active-reading { background: var(--highlight); border-color: orange; }
        .sentence-card { border-right: 5px solid var(--secondary); background: #fafafa; padding: 12px; margin-bottom: 8px; border-radius: 10px; cursor: pointer; text-align: left; direction: ltr; }
        .sentence-card.active-reading { background: var(--highlight); }
        .s-en { font-weight: bold; font-size: 17px; display: block; color: #2d3436; }
        .s-ar { font-size: 14px; color: #636e72; display: block; text-align: right; direction: rtl; margin-top: 4px; }
        .quiz-box { text-align: center; padding: 15px; }
        .opt-btn { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #ddd; border-radius: 12px; background: white; font-weight: bold; cursor: pointer; font-family: 'Cairo'; }
        .opt-btn.correct { background: var(--success); color: white; border-color: var(--success); }
        .opt-btn.wrong { background: var(--danger); color: white; border-color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <h1>Lesson 3: Shapes and Colors 📐🎨</h1>

    <div class="controls">
        <button class="btn btn-play" id="btnPlay" onclick="playAll()">قراءة الكل ▶️</button>
        <button class="btn btn-pause" id="btnPause" onclick="togglePause()">مؤقت ⏸️</button>
        <button class="btn btn-stop" id="btnStop" onclick="stopAudio()">إيقاف ⏹️</button>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="showSec('vocab', this)">🔤 الكلمات</button>
        <button class="tab-btn" onclick="showSec('story', this)">📖 المحادثة</button>
        <button class="tab-btn" onclick="showSec('quiz', this)">✍️ اختبار</button>
    </div>

    <div id="secVocab" class="vocab-grid"></div>
    <div id="secStory" style="display:none;"></div>
    <div id="secQuiz" style="display:none;"></div>
</div>

<script>
const vocab = [
    { en: "Green", ar: "أخضر", emoji: "🟢" }, { en: "Blue", ar: "أزرق", emoji: "🔵" },
    { en: "Yellow", ar: "أصفر", emoji: "🟡" }, { en: "Red", ar: "أحمر", emoji: "🔴" },
    { en: "Square", ar: "مربع", emoji: "🔲" }, { en: "Circle", ar: "دائرة", emoji: "⚪" },
    { en: "Triangle", ar: "مثلث", emoji: "🔺" }, { en: "Rectangle", ar: "مستطيل", emoji: "🟧" }
];

const story = [
    { en: "A: What shape is this?", ar: "أ: ما هذا الشكل؟" },
    { en: "B: This is a circle.", ar: "ب: هذه دائرة." },
    { en: "A: What color is the square?", ar: "أ: ما لون المربع؟" },
    { en: "B: The square is blue.", ar: "ب: المربع لونه أزرق." },
    { en: "The triangle has 3 sides.", ar: "المثلث له 3 أضلاع." },
    { en: "The rectangle has 4 sides.", ar: "المستطيل له 4 أضلاع." }
];

let currentTab = 'vocab', isPlaying = false, isPaused = false;
const synth = window.speechSynthesis;

function init() {
    renderVocab();
    renderStory();
    renderQuiz();
}

function renderVocab() {
    document.getElementById('secVocab').innerHTML = vocab.map(v => `
        <div class="vocab-card" onclick="speak('${v.en}', this)">
            <span style="font-size:30px;">${v.emoji}</span>
            <div style="font-weight:bold;color:var(--primary);">${v.en}</div>
            <small>${v.ar}</small>
        </div>
    `).join('');
}

function renderStory() {
    document.getElementById('secStory').innerHTML = story.map(s => `
        <div class="sentence-card" onclick="speak('${s.en}', this)">
            <span class="s-en">${s.en}</span>
            <span class="s-ar">${s.ar}</span>
        </div>
    `).join('');
}

function renderQuiz() {
    const box = document.getElementById('secQuiz');
    const correct = vocab[Math.floor(Math.random() * vocab.length)];
    let opts = [correct.ar];
    while(opts.length < 3) {
        let r = vocab[Math.floor(Math.random() * vocab.length)].ar;
        if(!opts.includes(r)) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);

    box.innerHTML = `
        <div class="quiz-box">
            <h3>ما معنى كلمة: <span style="color:var(--primary);font-size:24px;">${correct.en}</span>؟</h3>
            ${opts.map(o => `<button class="opt-btn" onclick="checkAns(this, '${o}', '${correct.ar}')">${o}</button>`).join('')}
        </div>
    `;
}

function checkAns(btn, sel, cor) {
    if(sel === cor) {
        btn.classList.add('correct');
        speak("Great job!", null, () => setTimeout(renderQuiz, 1000));
    } else {
        btn.classList.add('wrong');
        speak("Try again", null);
    }
}

function showSec(tab, btn) {
    stopAudio();
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('secVocab').style.display = tab === 'vocab' ? 'grid' : 'none';
    document.getElementById('secStory').style.display = tab === 'story' ? 'block' : 'none';
    document.getElementById('secQuiz').style.display = tab === 'quiz' ? 'block' : 'none';
}

function speak(text, el, callback) {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.7;
    u.onstart = () => el?.classList.add('active-reading');
    u.onend = () => { el?.classList.remove('active-reading'); if(callback) callback(); };
    u.onerror = () => { el?.classList.remove('active-reading'); if(callback) callback(); };
    synth.speak(u);
}

async function playAll() {
    if(isPlaying) return;
    isPlaying = true; isPaused = false;
    document.getElementById('btnPlay').style.display = 'none';
    document.getElementById('btnPause').style.display = 'inline-block';
    document.getElementById('btnStop').style.display = 'inline-block';

    const selector = currentTab === 'vocab' ? '.vocab-card' : '.sentence-card';
    const items = document.querySelectorAll(selector);
    const list = currentTab === 'vocab' ? vocab : story;

    for(let i = 0; i < items.length; i++) {
        if(!isPlaying) break;
        while(isPaused && isPlaying) await new Promise(r => setTimeout(r, 100));
        if(!isPlaying) break;

        items[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
        await new Promise(res => speak(list[i].en, items[i], res));
        await new Promise(r => setTimeout(r, 400));
    }
    stopAudio();
}

function togglePause() {
    isPaused = !isPaused;
    document.getElementById('btnPause').textContent = isPaused ? 'استئناف ▶️' : 'مؤقت ⏸️';
    isPaused ? synth.pause() : synth.resume();
}

function stopAudio() {
    isPlaying = false; isPaused = false; synth.cancel();
    document.getElementById('btnPlay').style.display = 'inline-block';
    document.getElementById('btnPause').style.display = 'none';
    document.getElementById('btnStop').style.display = 'none';
    document.getElementById('btnPause').textContent = 'مؤقت ⏸️';
    document.querySelectorAll('.active-reading').forEach(e => e.classList.remove('active-reading'));
}

window.onload = init;
</script>
</body>
</html>
