// ===================== دالة تنظيف النص للصوت =====================
function cleanForSpeech(text) {
    let result = text;
    // 1. إزالة الأقواس وكل ما بداخلها
    result = result.replace(/\([^)]*\)/g, ' ');
    // 2. إزالة علامات الترقيم والرموز الخاصة
    result = result.replace(/[\/\:\"\']/g, ' ');
    // 3. إزالة الأسهم
    result = result.replace(/[→]/g, ' ');
    // 4. تنظيف المسافات الزائدة
    result = result.replace(/\s+/g, ' ').trim();
    return result;
}

// ===================== دوال HTML المساعدة =====================
function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

function makePills(wordsArray, sectionId) {
    return wordsArray.map((w, i) => {
        const id = `${sectionId}_p${i}`;
        const wordHtml = makeWordSpans(w[0]);
        const speakText = cleanForSpeech(w[0]);
        return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
    }).join('');
}

function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
    const id = `${sectionId}_${index}`;
    const wordHtml = makeWordSpans(displayText || speakText);
    const finalSpeak = cleanForSpeech(speakText);
    return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
        <span class="rule-icon">${icon}</span>
        <div class="rule-text">
            <span class="en">${wordHtml}</span>
            <span class="ar">${arText || ''}</span>
        </div>
    </div>`;
}

function playBar(sectionId) {
    return `<div class="sec-play-bar">
        <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
        <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
        <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
    </div>`;
}

function makeStorySection(title, storyData) {
    return `<div class="story-card">
        <div style="font-weight:bold;color:var(--A);margin-bottom:10px;">${title}</div>
        ${storyData.map((s,i) => {
            const id = `secStory_${title.replace(/[^a-zA-Z0-9]/g,'')}_${i}`;
            const wordHtml = makeWordSpans(s.en);
            const cleanEn = cleanForSpeech(s.en);
            return `<div class="sentence" id="${id}" data-speak="${cleanEn}" onclick="playOne('${id}')">
                ${wordHtml}
            </div> `;
        }).join('')}
        <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
    </div>`;
}

        { title:"🔑 Key Vocabulary", id:"secKey", content: `<div class="info-box"><div class="info-title">Key Vocabulary (Lesson 3)</div><div class="vocab">${makePills(keyVocab, "secKey")}</div></div>` },
        { title:"🔗 Collocations", id:"secCollocations", content: `<div class="rules-grid">${collocationsData.map((c,i) => makeRuleItem('🔗', 'secCollocations', i, c[0], c[1], c[0])).join('')}</div>` },
        { title:"🔄 Synonyms", id:"secSyn", content: `<div class="rules-grid">${synData.map((s,i) => makeRuleItem('↔️', 'secSyn', i, `${s.word} | ${s.syn}`, s.syn, `${s.word} → ${s.syn}`)).join('')}</div>` },
        { title:"🚫 Antonyms", id:"secAnt", content: `<div class="rules-grid">${antData.map((a,i) => makeRuleItem('🛑', 'secAnt', i, `${a.word} | ${a.ant}`, a.ant, `${a.word} → ${a.ant}`)).join('')}</div>` },
        { title:"🔚 Prefixes & Suffixes", id:"secAffix", content: `<div class="rules-grid">${affixData.map((p,i) => makeRuleItem('🔤', 'secAffix', i, `${p.word} | ${p.affix}`, `${p.affix} ${p.func}`, p.word)).join('')}</div>` },
        { title:"⏳ Irregular Verbs", id:"secConj", content: `<div class="rules-grid">${conjData.map((c,i) => makeRuleItem('🕒', 'secConj', i, `${c.present} | ${c.past} | ${c.pp}`, 'مضارع / ماضي / تصريف ثالث', `${c.present} → ${c.past} → ${c.pp}`)).join('')}</div>` },
        { title:"📝 Definitions", id:"secDefs", content: `<div class="rules-grid">${defsData.map((d,i) => makeRuleItem('📖', 'secDefs', i, `${d.word} | ${d.def}`, d.def, d.word)).join('')}</div>` },
        { title:"💬 Expressions & Prepositions", id:"secExpPrep", content: `<div class="rules-grid">${expPrepData.map((e,i) => makeRuleItem('💡', 'secExpPrep', i, e[0], e[1], e[0])).join('')}</div>` },
        { title:"📖 Reading Text (Lesson 3)", id:"secRead", content: makeStorySection("The Gen Z-Alpha Bridge", readingText) }
    ];

    let html = '';
    sections.forEach(sec => {
        html += `<div class="section-block" id="${sec.id}">
            <div class="sec-title">${sec.title}</div>
            <div class="sec-body">
                ${playBar(sec.id)}
                ${sec.content}
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

// ===================== نظام الصوت والمزامنة =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
let voiceLoadAttempt = 0;
const MAX_VOICE_LOAD_ATTEMPTS = 6;
const VOICE_RETRY_DELAYS = [0, 150, 400, 800, 1500, 2500];

const normalizeVoiceLang = (lang) => String(lang || '').replace('_', '-');
const isVoiceLangMatch = (voiceLang, targetLang) => {
    const normalized = normalizeVoiceLang(voiceLang).toLowerCase();
    const target = targetLang.toLowerCase();
    return normalized === target || normalized.startsWith(target + '-');
};
const voiceQualityScore = (voice) => {
    const name = String(voice.name || '').toLowerCase();
    let score = 0;
    if (name.includes('google')) score += 30;
    if (name.includes('microsoft')) score += 25;
    if (name.includes('samantha')) score += 20;
    if (voice.localService) score += 2;
    return score;
};
const sortVoicesByQuality = (voiceList) => [...voiceList].sort((a, b) => {
    const scoreDifference = voiceQualityScore(b) - voiceQualityScore(a);
    return scoreDifference || String(a.name || '').localeCompare(String(b.name || ''));
});

function loadVoices() {
    const availableVoices = window.speechSynthesis.getVoices();
    if (availableVoices.length) {
        voices = availableVoices;
        voiceLoadAttempt = 0;
        populateVoiceSelect();
        return;
    }

    if (voiceLoadAttempt < MAX_VOICE_LOAD_ATTEMPTS) {
        const delay = VOICE_RETRY_DELAYS[voiceLoadAttempt] || VOICE_RETRY_DELAYS[VOICE_RETRY_DELAYS.length - 1];
        voiceLoadAttempt++;
        window.setTimeout(loadVoices, delay);
    }
}

function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    if (!vs || !voices.length) return;

    const englishVoices = voices.filter(v =>
        isVoiceLangMatch(v.lang, 'en-US') || isVoiceLangMatch(v.lang, 'en-GB')
    );
    const displayedVoices = englishVoices.length ? sortVoicesByQuality(englishVoices) :
        sortVoicesByQuality(voices.filter(v => normalizeVoiceLang(v.lang).toLowerCase().startsWith('en')));

    if (!displayedVoices.length) {
        note.textContent = '⚠️ No English voice found.';
        return;
    }

    note.textContent = englishVoices.length ? '' : '⚠️ No US/UK voice found; showing English voices.';
    const savedURI = localStorage.getItem('voiceURI');
    const savedLang = localStorage.getItem('voiceLang');
    vs.innerHTML = displayedVoices.map((voice) => {
        const lang = normalizeVoiceLang(voice.lang);
        const label = `${isVoiceLangMatch(lang, 'en-US') ? '🇺🇸 American' : isVoiceLangMatch(lang, 'en-GB') ? '🇬🇧 British' : 'English'} — ${voice.name} (${lang})`;
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = label;
        option.dataset.lang = lang;
        return option.outerHTML;
    }).join('');

    const savedOption = [...vs.options].find(option => option.value === savedURI) ||
        [...vs.options].find(option => option.dataset.lang === savedLang);
    vs.value = savedOption ? savedOption.value : vs.options[0].value;
    const selected = voices.find(v => v.voiceURI === vs.value) || displayedVoices[0];
    localStorage.setItem('voiceURI', selected.voiceURI);
    localStorage.setItem('voiceLang', normalizeVoiceLang(selected.lang));
}

document.getElementById('voiceSelect').addEventListener('change', function() {
    const selected = voices.find(v => v.voiceURI === this.value);
    if (selected) {
        localStorage.setItem('voiceURI', selected.voiceURI);
        localStorage.setItem('voiceLang', normalizeVoiceLang(selected.lang));
    }
});

function getSelectedVoice() {
    const select = document.getElementById('voiceSelect');
    const savedURI = localStorage.getItem('voiceURI');
    const savedLang = localStorage.getItem('voiceLang');
    const selectedURI = savedURI || (select && select.value);
    return voices.find(v => v.voiceURI === selectedURI) ||
        voices.find(v => savedLang && normalizeVoiceLang(v.lang) === savedLang) ||
        voices.find(v => select && v.voiceURI === select.value) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    document.querySelectorAll('.word.highlight').forEach(e => e.classList.remove('highlight'));
    currentHighlightedId = null;
}

function showFab(show) {
    if (show) fabPause.classList.add('show');
    else fabPause.classList.remove('show');
}

function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        fabPause.innerHTML = '⏸️';
    } else if (window.speechSynthesis.paused) {
        fabPause.innerHTML = '▶️';
    } else {
        fabPause.innerHTML = '⏯️';
    }
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights();
        showFab(false);
        return;
    }
    const item = window._q[window._qi];
    const el = document.getElementById(item.id);
    
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }

    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    // Set the language explicitly; several browsers otherwise ignore the selected voice.
    u.lang = voice ? normalizeVoiceLang(voice.lang) : (localStorage.getItem('voiceLang') || 'en-US');
    if (voice) u.voice = voice;

    u.onboundary = (event) => {
        if (event.name === 'word' && el) {
            const wordSpans = el.querySelectorAll('.word');
            const textUntilIndex = item.text.substring(0, event.charIndex);
            const wordIndex = textUntilIndex.trim().split(/\s+/).filter(Boolean).length;
            
            wordSpans.forEach(span => span.classList.remove('highlight'));
            if (wordSpans[wordIndex]) {
                wordSpans[wordIndex].classList.add('highlight');
            }
        }
    };

    u.onstart = () => {
        showFab(true);
        updateFabIcon();
    };

    u.onend = function() {
        if (el) el.querySelectorAll('.word').forEach(span => span.classList.remove('highlight'));
        window._qi++;
        playQueue();
    };

    u.onerror = function(e) {
        console.warn('Speech error', e);
        window._qi++;
        playQueue();
    };

    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => {
        const trimmed = cleanForSpeech(p);
        if (trimmed) {
            window._q.push({id: id, text: trimmed});
        }
    });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause();
        updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() {
    pauseAll();
}

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
